main{max-width:560px;margin:0 auto;padding:18px 16px 24px}
h1{font-size:2rem;line-height:1.1;margin:8px 0 10px;font-weight:800}

p{margin:0 0 10px}.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.fact{border-color:var(--acc)}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--surf);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:48px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.go{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;width:100%;font-size:1.1rem}
.world{display:block;width:100%;text-align:left;margin:10px 0}
.world b{display:block;font-size:1.15rem}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{margin:8px 0}.meter .row{display:flex;justify-content:space-between}
.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:8px;transition:width .5s}
.low .row b{color:var(--acc)}
.alloc{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.alloc:first-of-type{border-top:0}
.alloc .t{flex:1}.alloc .t span{display:block;font-size:.85rem;color:var(--mute)}
.alloc .n{width:28px;text-align:center;font-weight:800;font-size:1.3rem}
.sq{width:48px;padding:0;font-size:1.4rem}
.warn{border-left:6px solid var(--acc);padding:8px 12px;margin:8px 0;background:var(--surf);border-radius:8px;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt b{display:block}.opt span{font-size:.95rem;color:var(--mute)}
.res{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}.res .bar{flex:1}.res i{width:96px;font-style:normal}
.big{font-size:2.6rem;margin:0}
ol{padding-left:22px;margin:0}li{margin:4px 0}
ul.f{padding-left:20px;margin:0;font-size:.95rem}
footer{max-width:560px;margin:0 auto;padding:6px 16px 32px;text-align:center;color:var(--mute);font-size:.85rem}

x-shadow:0 0 0 9px rgba(232,64,28,0)}}button:active:not(:disabled){transform:scale(.95)}.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.conf span{position:absolute;top:-30px;font-size:1.6rem;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}.astro{opacity:0;animation:walk 1.5s ease-out forwards}@keyframes walk{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}85%{opacity:1;transform:translate(var(--dx),var(--dy))}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}.pop{opacity:0;animation:pop 1.2s 1.2s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translateY(6px)}30%{opacity:1;transform:translateY(-6px)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}.up{animation:upin .6s 1.3s both}@keyframes upin{from{opacity:0}to{opacity:1}}.seg{display:flex;gap:8px}.seg button{flex:1}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surf)}@media (prefers-reduced-motion:reduce){.fill{transition:none}.tw{animation:none}.float{animation:none}.astro,.pop{display:none}.up{animation:none}.fly,.shoot,.drift,.bob,.blink,.mood,.ev,.go,.shake{animation:none}.conf{display:none}}

  facts:["A day and a night on the Moon each last about 14 Earth days.","Moon gravity is about one-sixth of Earth’s. You could jump very high!","The Moon has almost no air, so sunlight and space radiation hit the ground directly.","Moon surface temperatures range from about −173 °C to 127 °C.","NASA’s Lunar Reconnaissance Orbiter measured −247 °C inside a Moon crater, one of the coldest places found in our solar system.","In the daytime the Moon’s surface can reach about 120 °C, hotter than boiling water on Earth.","The Moon has no seasons. Your base gets about 14 days of sunlight, then about 14 days of dark.","Moon dust is sharp and sticks to everything, so engineers must plan for it."]},

function mood(){var a=(S.m.o2+S.m.pw+S.m.sh+S.m.fd)/4;return '<div class="top"><span>Crew mood</span><span class="mood">'+(a>=70?"😀":a>=50?"🙂":a>=30?"😟":"😰")+'</span></div>'}
function rf(a,k){var e=document.querySelector("["+a+"=\""+k+"\"]");if(e&&!e.disabled)e.focus({preventScroll:true})}
function clamp(v){return Math.max(0,Math.min(100,v))}
function night(){return S.w==="moon"&&S.sol>=4&&S.sol<=5}
function left(){return 3-(S.spent||0)}
function chips(e){var s=[];SYS.forEach(function(y){if(e[y.k])s.push(y.i+" "+(e[y.k]>0?"+":"−")+Math.abs(e[y.k]))});return s.join("  ")||"No change"}
function intro(w){
 app.innerHTML='<button id="bk">← Back</button>'+scene(w,0,1)+'<h1>'+W[w].icon+' '+W[w].name+'</h1><p>'+W[w].blurb+'</p><div class="card fact"><h2>📖 How to play</h2><ol><li>Each day you get <b>3 working hours</b>.</li><li>Tap <b>+</b> to give an hour to Air, Power, Shield or Food. An astronaut will upgrade your base.</li><li>Use all 3 hours, then start the day.</li><li>Read the NASA fact and keep your crew safe for '+DAYS+' days!</li></ol></div><div class="warn" role="note"><b>Please note:</b> Working hours cannot be replaced even after pressing (−).</div><button class="go" id="gp">🚀 Start mission</button>';
 document.getElementById("bk").onclick=worlds;document.getElementById("gp").onclick=function(){start(w)}
}
function start(w){S={w:w,sol:1,m:{o2:70,pw:70,sh:70,fd:70},a:{o2:0,pw:0,sh:0,fd:0},u:{o2:0,pw:0,sh:0,fd:0},ev:null,note:"",seen:[]};draw()}
function meters(){return SYS.map(function(s){var v=Math.round(S.m[s.k]);return '<div class="meter'+(v<25?' low':'')+'"><div class="row"><span>'+s.i+' '+s.n+'</span><b>'+v+'%'+(v<25?' – low!':'')+'</b></div><div class="bar"><div class="fill" style="width:'+v+'%;background:'+COL[s.k]+'"></div></div></div>'}).join("")}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
var ST=load("hz_set")||{sound:"on",big:"normal",theme:"auto"};
function applySet(){var r=document.documentElement;if(ST.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",ST.theme);document.body.style.fontSize=ST.big==="large"?"1.25rem":""}
function save(){if(S){var a=S.anim;S.anim=null;store("hz_save",S);S.anim=a}}
function beep(f){if(ST.sound!=="on")return;try{var c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=0.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.12)}catch(e){}}
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("button"))beep(520)});
function find(t){return EV.filter(function(x){return x.t===t})[0]||null}
function cont(){var s=load("hz_save");if(!s||!W[s.w])return;S=s;if(S.ev)S.ev=find(S.ev.t);if(S.pending){var p=S.pending;p.e=find(p.e&&p.e.t);if(!p.e)S.pending=null}draw()}
function home(){
 var sv=load("hz_save"),ok=sv&&W[sv.w],info=ok?W[sv.w].name+", day "+sv.sol:"No saved game yet";
 app.innerHTML=scene("moon",0,1)+'<div style="text-align:center"><p class="big float">🚀</p><h1>Junior Astronaut Mission Trainer</h1><p class="mute">Run a space base. Learn real NASA facts.</p></div><div class="menu"><button class="go" id="ng"><span class="ic">▶️</span><b>New game</b></button><button id="ct"'+(ok?'':' disabled')+'><span class="ic">⏯️</span><div><b>Continue</b><br><span>'+info+'</span></div></button><button id="st"><span class="ic">⚙️</span><b>Settings</b></button><button id="ex"><span class="ic">🚪</span><b>Exit</b></button></div><p class="mute" style="text-align:center">Made by Team Horzonyx</p>';
 document.getElementById("ng").onclick=worlds;document.getElementById("ct").onclick=cont;document.getElementById("st").onclick=settings;document.getElementById("ex").onclick=bye
}
function seg(k,o){return '<div class="seg">'+o.map(function(x){return '<button data-s="'+k+'" data-v="'+x[0]+'" aria-pressed="'+(ST[k]===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'}
function settings(){
 app.innerHTML='<button id="bk">← Menu</button><h1>⚙️ Settings</h1><div class="card"><h2>🔊 Sound</h2>'+seg("sound",[["on","On"],["off","Off"]])+'</div><div class="card"><h2>🔤 Text size</h2>'+seg("big",[["normal","Normal"],["large","Large"]])+'</div><div class="card"><h2>🎨 Colors</h2>'+seg("theme",[["auto","Auto"],["light","Light"],["dark","Dark"]])+'</div><div class="card"><h2>🗑️ Saved game</h2><p class="mute">Your game saves by itself on this device.</p><button id="rs">Delete saved game</button></div>';
 document.getElementById("bk").onclick=home;
 app.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){ST[b.dataset.s]=b.dataset.v;store("hz_set",ST);applySet();settings()}});
 document.getElementById("rs").onclick=function(){if(this.dataset.c){store("hz_save",null);S=null;settings()}else{this.dataset.c=1;this.textContent="Tap again to delete"}}
}
function bye(){
 app.innerHTML='<p class="big" style="text-align:center">👋</p><h1 style="text-align:center">Thanks for playing!</h1><div class="card"><p>Your game is saved. You can close this tab now, or come back any time to continue.</p><p class="mute">Made by Team Horzonyx for the NASA Space Apps Challenge.</p></div><button class="go" id="bk">Back to menu</button>';
 document.getElementById("bk").onclick=home
}
function worlds(){
 app.innerHTML='<button id="bk">← Menu</button><h1>New game</h1><p>Keep your astronauts safe on 8 different space bases for '+DAYS+' days.</p>'+
 '<div class="card"><h2>How to play</h2><ol><li>Each day you have <b>3 worker hours</b>.</li><li>Tap <b>+</b> to give hours. An astronaut will come out and upgrade your base!</li><li>Every system slowly drops each day. Do not let any reach 0%!</li></ol></div>'+
 '<h2>Pick your mission</h2>'+(load("hz_save")?'<p class="mute">Starting a new game replaces your saved game.</p>':'')+Object.keys(W).map(function(k){return '<button class="world" data-w="'+k+'">'+scene(k)+'<b>'+W[k].icon+' '+W[k].name+'</b><span class="mute">'+W[k].blurb+'</span></button>'}).join("")+
 '<div class="card"><h2>About this project</h2><p class="mute">Real space engineers must balance air, power, shields and food. This game lets you feel those choices. Every day shows a real fact from NASA science. Built by <b>Team Horzonyx</b>.</p></div>';
 app.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){intro(b.dataset.w)}});document.getElementById("bk").onclick=home
}
function draw(){
 if(!S){home();return}
 save();if(S.pending){showFact();return}if(S.ev){drawEvent();return}
 var w=W[S.w],l=left(),warn="";
 if(night())warn+='<div class="warn">🌑 Moon night! Power drops faster today.</div>';
 if(S.m.pw<25)warn+='<div class="warn">⚡ Power is low, so Air and Food grow only half as much.</div>';
 if(S.m.sh<25)warn+='<div class="warn">🛡️ Shield is low. Radiation is getting dangerous!</div>';
 app.innerHTML='<div class="top"><button id="mn">☰ Menu</button><span>'+w.icon+' <b>'+w.name+'</b></span></div><div class="bar" role="img" aria-label="Mission progress"><div class="fill" style="width:'+Math.round((S.sol-1)/DAYS*100)+'%;background:var(--acc)"></div></div><p class="mute">Day '+S.sol+' of '+DAYS+'</p>'+
 scene(S.w,1)+'<p role="status" class="st'+(S.msg?' shake':'')+'">'+(S.anim?'🧑‍🚀 Upgrading '+SYS.filter(function(s){return s.k===S.anim})[0].n+'!':S.msg?'🧑‍🚀 Work cancelled. That hour is already used and does not come back.':'&nbsp;')+'</p>'+(S.note?'<p class="mute">'+S.note+'</p>':'')+'<div class="card">'+mood()+meters()+'</div>'+warn+
 '<div class="card"><h2>Give worker hours: '+"●".repeat(l)+"○".repeat(3-l)+' ('+l+' left)</h2><p class="mute">Choose carefully. The − button doesn’t give hours back.</p>'+
 SYS.map(function(s){return '<div class="alloc"><div class="t">'+s.i+' '+s.n+'<span>'+s.tip+(S.a[s.k]?' · +'+S.a[s.k]*25+'% at day end':'')+'</span></div><button class="sq" aria-label="Less '+s.n+'" data-m="'+s.k+'"'+(S.a[s.k]<1?' disabled':'')+'>−</button><div class="n">'+S.a[s.k]+'</div><button class="sq" aria-label="More '+s.n+'" data-k="'+s.k+'" data-d="1"'+(l<1?' disabled':'')+'>+</button></div>'}).join("")+
 '</div><button class="go" id="run"'+(l?' disabled':'')+'>'+(l?'Use all 3 hours to start':'Start day '+S.sol)+'</button>';
 S.anim=null;S.msg=null;app.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var k=b.dataset.m;if(S.a[k]>0)S.a[k]--;S.msg=1;var y=window.scrollY;draw();window.scrollTo(0,y);rf("data-m",k)}});app.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){var k=b.dataset.k,d=+b.dataset.d;S.a[k]+=1;S.spent=(S.spent||0)+1;S.anim=k;var y=window.scrollY;draw();window.scrollTo(0,y);rf("data-k",k)}});
 document.getElementById("run").onclick=run;document.getElementById("mn").onclick=home
}
function fails(){var r={o2:["The air ran out","Air is the first thing mission planners protect."],pw:["The power ran out","Pumps, heaters and air cleaners all need electricity."],sh:["Radiation got too strong","Space has no thick air like Earth. Crews need shields and shelters."],fd:["The food ran out","Long missions need plants or stored food. Growing food also uses power and time."]};
 for(var k in r){if(S.m[k]<=0)return r[k]}return null}
function run(){
 var d=W[S.w].d,f=1+S.sol*0.05,eff=S.m.pw<25?0.5:1;
 SYS.forEach(function(s){var k=s.k,g=S.a[k]*25*((k==="o2"||k==="fd")?eff:1),x=Math.round(d[k]*f)+(night()&&k==="pw"?12:0);S.m[k]=clamp(S.m[k]+g-x);S.u[k]+=S.a[k];S.a[k]=0});S.spent=0;
 var fl=fails();if(fl)return end(false,fl);
 S.note="";
 var pool=EV.filter(function(e){return e.w==="both"||e.w===S.w});
 S.ev=pool[Math.floor(Math.random()*pool.length)];
 draw()
}
function drawEvent(){save();
 var e=S.ev;
 app.innerHTML=scene(S.w,1)+'<div class="top"><h2>Day '+S.sol+' alert</h2></div><div class="card">'+mood()+meters()+'</div><div class="card"><p class="ev">'+EVI[EV.indexOf(e)]+'</p><h2>'+e.t+'</h2><p>'+e.x+'</p>'+
 e.c.map(function(c,i){return '<button class="opt" data-i="'+i+'"><b>'+c.n+'</b><span>'+chips(c.e)+'</span></button>'}).join("")+'</div>';
 app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){choose(+b.dataset.i)}})
}
function choose(i){
 var c=S.ev.c[i],e=S.ev,w=W[S.w],fa=w.facts[(S.sol-1)%w.facts.length];
 for(var k in c.e)S.m[k]=clamp(S.m[k]+c.e[k]);
 S.seen.push(e.f);S.seen.push(fa);
 var fl=fails();if(fl)return end(false,fl);
 S.ev=null;S.pending={e:e,c:c,fa:fa};showFact()
}
function showFact(){save();
 var p=S.pending;
 app.innerHTML='<h2>Day '+S.sol+' report</h2><div class="card">'+meters()+'</div><div class="card fact"><p class="ev">'+EVI[EV.indexOf(p.e)]+'</p><h2>🔭 NASA fact</h2><p><b>'+p.e.t+'</b> '+p.e.f+'</p><p>'+p.fa+'</p></div><button class="go" id="nx">'+(S.sol>=DAYS?'Finish mission':'Go to day '+(S.sol+1))+'</button>';
 document.getElementById("nx").onclick=function(){S.note="You chose: "+p.c.n.toLowerCase()+".";S.pending=null;S.sol++;if(S.sol>DAYS)return end(true);draw()}
}
function confetti(){var d=document.createElement("div"),e=["⭐","🎉","🚀","✨"],h="",i;d.className="conf";d.setAttribute("aria-hidden","true");for(i=0;i<24;i++)h+='<span style="left:'+(i*4.3%100)+'%;animation-delay:'+(i%8*0.15)+'s">'+e[i%4]+'</span>';d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
function end(win,fl){store("hz_save",null);if(win)setTimeout(confetti,50);
 var avg=Math.round((S.m.o2+S.m.pw+S.m.sh+S.m.fd)/4),tot=0,w=W[S.w];
 for(var k in S.u)tot+=S.u[k];tot=tot||1;
 var rank=!win?"Cadet in training":avg>=70?"Mission Commander":avg>=45?"Flight Engineer":"Rookie Astronaut";
 var rep=SYS.map(function(s){var p=Math.round(S.u[s.k]/tot*100);return '<div class="res"><i>'+s.i+' '+s.n+'</i><div class="bar"><div class="fill" style="width:'+p+'%;background:'+COL[s.k]+'"></div></div><span>'+p+'%</span></div>'}).join("");
 var uniq=S.seen.filter(function(v,i,a){return a.indexOf(v)===i});
 app.innerHTML='<p class="big">'+(win?"🏆":"🛰️")+'</p><h1>'+(win?"Mission success!":"Mission over on day "+S.sol)+'</h1>'+
 '<div class="card"><p class="ev">'+(win?(avg>=70?"⭐⭐⭐":avg>=45?"⭐⭐":"⭐"):"☆☆☆")+'</p><h2>Your rank: '+rank+'</h2>'+(win?'<p>Your crew stayed safe for '+DAYS+' days at the '+w.name.toLowerCase()+'. Average system level: '+avg+'%.</p>':'<p><b>'+fl[0]+'.</b> '+fl[1]+' Try again and share your hours more evenly.</p>')+'</div>'+
 '<div class="card"><h2>Where your hours went</h2>'+rep+'<p class="mute">Helping one system means less help for the others. Real engineers make these trade-offs too.</p></div>'+
 (uniq.length?'<div class="card fact"><h2>Facts you learned</h2><ul class="f">'+uniq.map(function(f){return '<li>'+f+'</li>'}).join("")+'</ul></div>':'')+
 '<button class="go" id="again">Play again</button><br><br><button class="opt" id="menu"><b>Choose another world</b></button>';
 document.getElementById("again").onclick=function(){start(S.w)};
 document.getElementById("menu").onclick=function(){S=null;home()}
}
applySet();home();
</script>
</body>
